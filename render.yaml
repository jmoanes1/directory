# Render Blueprint — Django Employee Directory
#
# Do NOT deploy this repo as a "Static Site".
# Static Sites expect a publish folder like "build" and fail with:
#   "Publish directory build does not exist!"
#
# Use: Dashboard → New → Blueprint  (or New → Web Service)

services:
  - type: web
    name: employee-directory
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Explicit host + leading-dot form for any *.onrender.com hostname
      - key: ALLOWED_HOSTS
        value: "directory-d5w5.onrender.com,.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://directory-d5w5.onrender.com"
      # Link your Render Postgres in the dashboard, or paste DATABASE_URL here
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_BACKEND
        value: config.email_backends.ResilientEmailBackend
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
