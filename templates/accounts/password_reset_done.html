{% extends "base.html" %}

{% block auth_content %}
<div class="auth-page" style="grid-template-columns: 1fr;">
    <div class="auth-panel-right" style="width: 100%;">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo logo-lg" style="justify-content: center;"><span class="logo-icon">✉</span></div>
                <h1>Check your email</h1>
                <p>We've sent a password reset link to your registered email address. Please check your inbox. The link will expire in 60 minutes.</p>
            </div>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block" style="padding: 0.75rem;">Back to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
