{# Minimal overview stat — label, value, optional trend #}
<div class="dash-overview-stat">
    <span class="dash-overview-label">{{ label }}</span>
    <span class="dash-overview-value">{{ value }}</span>
    {% if trend is not None and trend != 0 %}
    <span class="dash-overview-trend dash-overview-trend--{% if trend_inverted %}{% if trend > 0 %}down{% elif trend < 0 %}up{% else %}neutral{% endif %}{% else %}{% if trend > 0 %}up{% elif trend < 0 %}down{% else %}neutral{% endif %}{% endif %}" title="Compared to last month">
        {% if trend > 0 %}+{% endif %}{{ trend|floatformat:0 }}%
    </span>
    {% endif %}
</div>
